<!--
  模板：简约白
  特点：大量留白、干净利落、适合干货/教程类文章
  关键词：简约、干净、专业、易读
  适配：微信亮色/暗色主题均可正常显示
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system-font, BlinkMacSystemFont, Helvetica Neue, PingFang SC, Hiragino Sans GB, Microsoft YaHei UI, Microsoft YaHei, Arial, sans-serif; color: #3f3f3f; font-size: 15px; line-height: 1.75; word-wrap: break-word; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;">

  <!-- 正文区 -->
  <section style="padding: 0 15px; text-align: justify;">
  {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="margin-top: 50px; padding: 25px 15px; text-align: center; border-top: 1px solid #eee;">
  <section style="font-size: 14px; line-height: 1.75; color: #bbb; margin: 0 0 12px;">
  — END —
  </section>
  <section style="font-size: 14px; line-height: 1.75; color: #666; margin: 0;">
  觉得有用？点个<strong style="color: #3f3f3f;">「在看」</strong>让更多人看到
  </section>
  </section>

</section>
