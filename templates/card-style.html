<!--
  模板：卡片式
  特点：模块化分隔、清晰易扫描、适合清单/盘点类文章
  关键词：模块化、清晰、易扫描
  适配：微信亮色/暗色主题均可正常显示
-->
<section style="margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system-font, BlinkMacSystemFont, Helvetica Neue, PingFang SC, Hiragino Sans GB, Microsoft YaHei UI, Microsoft YaHei, Arial, sans-serif; color: #3f3f3f; font-size: 15px; line-height: 1.75; word-wrap: break-word; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;">

  <!-- 字数统计 -->
  <section style="text-align: center; padding: 10px 15px 15px; margin-bottom: 15px; border-bottom: 1px solid #e0e0e0;">
  <section style="display: inline-block; padding: 4px 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 14px; color: #999;">
  全文共 {{WORD_COUNT}} 字
  </section>
  </section>

  <!-- 正文区 -->
  <section style="padding: 0 15px; text-align: justify;">
  {{CONTENT}}
  </section>

  <!-- 结尾区 -->
  <section style="margin-top: 40px; padding: 25px 15px; text-align: center; border-top: 1px solid #e0e0e0;">
  <section style="font-size: 14px; line-height: 1.75; color: #bbb; margin: 0 0 10px;">
  — END —
  </section>
  <section style="font-size: 14px; line-height: 1.75; color: #666; margin: 0;">
  觉得有用？点个<strong style="color: #4a90d9;">「在看」</strong>让更多人看到
  </section>
  </section>

</section>
